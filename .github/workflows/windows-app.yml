# Builds the Windows app (windows-app/) for x64 and arm64, each on a matching Windows
# machine, and checks that it works: the tests pass, the .exe is for the right CPU, it
# starts, its bundled browser driver downloads and drives Chromium, and the web server
# answers. The zips are attached to the run as "LEGO-Order-Scraper-windows-x64" and
# "LEGO-Order-Scraper-windows-arm64".
# Runs when the Windows app's files change, or on demand (Actions tab -> "Run workflow").
name: Windows app

on:
  workflow_dispatch:
  workflow_call:  # run by the Release workflow (release.yml)
  push:
    branches: [main]
    paths:
      - "windows-app/**"
      - ".github/workflows/windows-app.yml"

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false  # one architecture failing must not cancel the other
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Show the machine and Python
        run: python -c "import platform, sys; print(platform.machine(), sys.version)"

      - name: Install build requirements
        run: python -m pip install -r windows-app/requirements-windows.txt

      - name: Run the Python test suite on Windows
        run: python lego-tests/run_tests.py

      - name: Show the folder dialog on-top check
        # Same check as in the suite, run alone so its result shows here even when it passes.
        run: |
          $env:LEGO_WORK_DIR = Join-Path $env:RUNNER_TEMP "lego-dialog-data"
          $env:LEGO_LOG_FILE = ""
          python lego-tests/tests/test_output_dir.py | Select-String "Windows"

      - name: Make the icon
        working-directory: windows-app
        run: python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build the app
        working-directory: windows-app
        run: pyinstaller --noconfirm --clean LEGO_Order_Scraper_win.spec

      - name: Check - the app is built for ${{ matrix.arch }}
        working-directory: windows-app
        run: python check_exe_arch.py ${{ matrix.arch }} "dist/LEGO Order Scraper"

      - name: Check - the app starts and reports the scraper version
        working-directory: windows-app
        shell: pwsh
        run: |
          $out = & "dist\LEGO Order Scraper\LEGO Order Scraper.exe" --run-scraper --version
          Write-Host $out
          if ($out -notmatch "lego_orders_scraper.py \d+") { throw "unexpected --version output: $out" }

      - name: Check - bundled browser driver downloads and drives Chromium
        working-directory: windows-app
        shell: pwsh
        run: |
          & "dist\LEGO Order Scraper\LEGO Order Scraper.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "self-test failed (exit $LASTEXITCODE)" }

      - name: Check - the web server starts and answers
        working-directory: windows-app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\LEGO Order Scraper\LEGO Order Scraper.exe" -ArgumentList "--serve-only","--port","8799" -PassThru
          try {
            $cfg = $null
            for ($i = 0; $i -lt 60 -and -not $cfg; $i++) {
              Start-Sleep -Seconds 1
              try { $cfg = Invoke-RestMethod -Uri "http://127.0.0.1:8799/config" -TimeoutSec 2 } catch {}
            }
            if (-not $cfg) { throw "server never answered on port 8799" }
            Write-Host ("config: " + ($cfg | ConvertTo-Json -Compress))
            if ($cfg.app_mode -ne "browser") { throw "expected app_mode=browser, got $($cfg.app_mode)" }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing
            if ($page.Content -notmatch "LEGO") { throw "home page didn't load" }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Zip
        working-directory: windows-app
        shell: pwsh
        run: Compress-Archive -Force -Path "dist\LEGO Order Scraper" -DestinationPath "dist\LEGO-Order-Scraper-windows-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: LEGO-Order-Scraper-windows-${{ matrix.arch }}
          path: windows-app/dist/LEGO-Order-Scraper-windows-${{ matrix.arch }}.zip
          retention-days: 30
