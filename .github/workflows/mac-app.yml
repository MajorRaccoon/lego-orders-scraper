# Builds the native macOS app (mac-swift/) on a Mac and checks that it works: the Python
# and Swift tests pass (including Swift-vs-Python output parity), the app is universal
# (Apple Silicon + Intel), its version and signature are right, and it starts and reads a
# test page in its built-in browser. The zip is attached to the run as
# "LEGO-Order-Scraper-macOS".
# It also builds the Apple Mail reader ("LEGO Mail Orders", same Swift package) and checks that
# its command-line version reads the made-up mailbox in mac-swift/sample-mail. Its zip is
# attached as "LEGO-Mail-Orders-macOS".
# Signing: if the repository secrets MACOS_CERT_P12_DEV (the certificate + private key as a
# base64 .p12), MACOS_CERT_DEV_PASSWORD (its password) and MACOS_CERT_DEV_SIGN_IDENTITY (its
# name, e.g. "Apple Development: Jane Doe (AB12CD34EF)") are set, both apps are signed with
# that certificate; otherwise they're ad-hoc signed as before.
# Runs when the Mac app's files (or the Python scripts it must match) change, or on demand
# (Actions tab -> "Run workflow").
name: macOS app

on:
  workflow_dispatch:
  workflow_call:  # run by the Release workflow (release.yml)
  push:
    branches: [main]
    paths:
      - "mac-swift/**"
      - "lego_orders_scraper.py"
      - "lego_orders_to_html.py"
      - "lego-tests/tests/test_swift_parity.py"
      - "lego-tests/tests/test_webkit_price_lines.py"
      - ".github/workflows/mac-app.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERT_P12_DEV != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the machine, macOS and Swift
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          swift --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test requirements
        run: python -m pip install playwright cryptography flask

      - name: Run the Python test suite on macOS (includes the Swift parity check)
        run: python lego-tests/run_tests.py

      - name: Import the signing certificate (if set)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_DEV }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_DEV_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CERT_DEV_SIGN_IDENTITY }}
        run: |
          [[ -n "$IDENTITY" ]] || { echo "MACOS_CERT_DEV_SIGN_IDENTITY isn't set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # What the .p12 held (counts only - never names or contents).
          certs=$(security find-certificate -a "$KEYCHAIN" 2>/dev/null | grep -c '^keychain:' || true)
          keys=$(security dump-keychain "$KEYCHAIN" 2>/dev/null | grep -c 'class: 0x00000010' || true)
          echo "Imported $certs certificate(s) and $keys private key(s)."
          if [[ "$keys" -eq 0 ]]; then
            echo "::error::MACOS_CERT_P12_DEV has the certificate but not its private key, so nothing can be signed with it. In Keychain Access, open 'My Certificates', expand your 'Apple Development' certificate, select the certificate and the key under it together, choose File > Export Items as .p12, then update the secret with: base64 -i cert.p12 | pbcopy"
            exit 1
          fi
          # Let codesign use the key without a password prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$IDENTITY\"" \
            || { echo "::error::No valid signing identity named like MACOS_CERT_DEV_SIGN_IDENTITY in MACOS_CERT_P12_DEV. Check the name (security find-identity -v -p codesigning on your Mac). Valid identities found: $(security find-identity -v -p codesigning "$KEYCHAIN" | tail -1)"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing certificate imported."

      - name: Build the app (runs the Swift tests, builds, signs, zips)
        working-directory: mac-swift
        run: ./build_app.sh

      - name: Check - the app is universal, the right version, and properly signed
        working-directory: mac-swift
        run: |
          APP="dist/LEGO Order Scraper.app"
          archs=$(lipo -archs "$APP/Contents/MacOS/LEGO Order Scraper")
          echo "architectures: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "not universal: $archs"; exit 1; }
          want=$(sed -n 's/^public let legoSwiftVersion = "\(.*\)"/\1/p' Sources/LegoCore/Models.swift)
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          echo "version: $got (source says $want)"
          [[ -n "$want" && "$got" == "$want" ]] || { echo "version mismatch"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [[ -n "${SIGN_IDENTITY:-}" ]]; then
            codesign -dvv "$APP" 2>&1 | grep -qF "Authority=$SIGN_IDENTITY" || { echo "not signed with the certificate"; exit 1; }
            echo "signed with the certificate from MACOS_CERT_DEV_SIGN_IDENTITY"
          else
            echo "ad-hoc signed (no signing certificate set)"
          fi
          test -s "$APP/Contents/Resources/AppIcon.icns"

      - name: Check - the app starts and reads a page in its built-in browser
        working-directory: mac-swift
        run: |
          SITE="$RUNNER_TEMP/site"; OUT="$RUNNER_TEMP/selfcheck"
          mkdir -p "$SITE"
          cat > "$SITE/orders.html" <<'HTML'
          <!doctype html><html><head><title>Self-check page</title></head>
          <body><main><h1>My Orders</h1><p>Order Number: T123456789</p><p>Total $19.99</p></main></body></html>
          HTML
          python -m http.server 8798 --bind 127.0.0.1 --directory "$SITE" >/dev/null 2>&1 &
          SERVER=$!
          sleep 2
          LEGO_SELFCHECK="$OUT" LEGO_SELFCHECK_URL="http://127.0.0.1:8798/orders.html" \
            "dist/LEGO Order Scraper.app/Contents/MacOS/LEGO Order Scraper" &
          APP_PID=$!
          for i in $(seq 1 90); do kill -0 $APP_PID 2>/dev/null || break; sleep 1; done
          if kill -0 $APP_PID 2>/dev/null; then kill $APP_PID; kill $SERVER; echo "app didn't finish its self-check in 90 s"; exit 1; fi
          kill $SERVER || true
          echo "--- state.txt"; cat "$OUT/state.txt"
          echo "--- main-text.txt"; cat "$OUT/main-text.txt"; echo
          grep -q "Order Number: T123456789" "$OUT/main-text.txt" || { echo "the app didn't read the test page"; exit 1; }
          grep -q "^title: Self-check page" "$OUT/state.txt"

      - name: Build the Mail app (LEGO Mail Orders)
        working-directory: mac-swift
        run: ./build_mail_app.sh

      - name: Check - the Mail app is universal, the right version, and properly signed
        working-directory: mac-swift
        run: |
          APP="dist/LEGO Mail Orders.app"
          archs=$(lipo -archs "$APP/Contents/MacOS/LEGO Mail Orders")
          echo "architectures: $archs"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] || { echo "not universal: $archs"; exit 1; }
          want=$(sed -n 's/^public let legoMailVersion = "\(.*\)"/\1/p' Sources/LegoMail/Version.swift)
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          echo "version: $got (source says $want)"
          [[ -n "$want" && "$got" == "$want" ]] || { echo "version mismatch"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [[ -n "${SIGN_IDENTITY:-}" ]]; then
            codesign -dvv "$APP" 2>&1 | grep -qF "Authority=$SIGN_IDENTITY" || { echo "not signed with the certificate"; exit 1; }
            echo "signed with the certificate from MACOS_CERT_DEV_SIGN_IDENTITY"
          else
            echo "ad-hoc signed (no signing certificate set)"
          fi

      - name: Check - lego-mail reads the sample mailbox
        working-directory: mac-swift
        run: |
          OUT="$RUNNER_TEMP/mail-out"
          swift run -c release lego-mail --mail-dir sample-mail --output-dir "$OUT" --save-email-text "$OUT/text"
          python3 - "$OUT/lego_mail_orders.json" <<'PY'
          import json, sys
          orders = json.load(open(sys.argv[1]))
          nums = [o["order_number"] for o in orders]
          print("orders:", nums)
          assert nums == ["T100000003", "T100000004", "T100000002", "T100000001", "T099999999"], nums
          t1 = orders[3]
          assert t1["status"] == "Delivered" and t1["total"] == "808.72", t1
          assert [i["item_number"] for i in t1["items"]] == ["10294", "88012", "5008000"], t1["items"]
          PY
          test -s "$OUT/lego_mail_orders.csv"
          test -s "$OUT/lego_mail_orders.html"
          ls "$OUT/text"
          # The receipt PDF that Mail keeps in its Attachments folder is read by PDFKit.
          swift run -c release lego-mail --read-pdf "sample-mail/Mail/V10/00000000-SAMPLE-ACCOUNT/INBOX.mbox/11111111-SAMPLE/Data/Attachments/1007/2/Receipt 5550002.pdf" | tee "$OUT/read-pdf.txt"
          grep -q "LEGO Technic Lamborghini Sian | number 42115" "$OUT/read-pdf.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfcheck-screenshots
          path: ${{ runner.temp }}/selfcheck
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: LEGO-Order-Scraper-macOS
          path: mac-swift/dist/LEGO-Order-Scraper-native-mac.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: LEGO-Mail-Orders-macOS
          path: mac-swift/dist/LEGO-Mail-Orders-mac.zip
          retention-days: 30

      - name: Remove the signing keychain
        if: always() && env.HAS_SIGNING_CERT == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
