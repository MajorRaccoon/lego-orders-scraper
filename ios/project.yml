# The iPhone/iPad app, "LEGO Orders". XcodeGen turns this file into LegoOrders.xcodeproj:
#   brew install xcodegen && cd ios && xcodegen generate && open LegoOrders.xcodeproj
# The scraping, parsing and report code comes from the Swift package in ../mac-swift
# (the LegoCore and LegoWebKit libraries), shared with the Mac app.
name: LegoOrders
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  LegoOrderScraper:
    path: ../mac-swift
targets:
  LegoOrders:
    type: application
    platform: iOS
    scheme: {}  # a shared scheme, so xcodebuild can build it
    sources:
      - Sources
      - Assets.xcassets
    dependencies:
      - package: LegoOrderScraper
        product: LegoCore
      - package: LegoOrderScraper
        product: LegoWebKit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LEGO Orders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The JSON, CSV and HTML files show up in the Files app (On My iPhone > LEGO Orders).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Only standard HTTPS: no export-compliance questions on each TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Overridden by the iOS workflow from the IOS_BUNDLE_ID variable and the team secret.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.majorraccoon.legoorders
        PRODUCT_NAME: LegoOrders
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
